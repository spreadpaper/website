name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Never cancel a deploy in flight: a half-uploaded asset manifest beats a queued run.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 24: the rig scripts and page test are TypeScript run by Node directly.
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run check

      - name: Build
        run: npm run build

      - name: Check rig geometry
        run: npm run rigs:check

      - name: Test built page
        run: node test/page.test.ts

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
